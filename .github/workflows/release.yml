name: Auto Build and Release

on:
  push:
    tags:
      - 'v*'  # 當你推送開頭為 v 的 tag 時觸發，例如 v1.0.1

jobs:
  build-and-release:
    runs-on: windows-latest  # 如果你的程式需要打包成 Windows 執行檔

    steps:
    - name: 簽出程式碼 (Checkout code)
      uses: actions/checkout@v4

    - name: 設定 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # 依你的專案 Python 版本調整
        cache: 'pip'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 使用 PyInstaller 打包 (資料夾模式)
      run: |
        # 注意這裡改成了 --onedir (或不加參數預設就是資料夾模式)
        pyinstaller --onedir --noconsole main.py

    - name: 安裝 Inno Setup
      run: |
        # 利用 choco 自動安裝 Inno Setup
        choco install innosetup -y

    - name: 編譯安裝檔 (Installer)
      shell: cmd
      run: |
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: 建立 GitHub Release 並上傳安裝檔
      uses: softprops/action-gh-release@v2
      with:
        # 指向 output 資料夾下剛剛打包好的安裝檔
        files: output/ntpc-road-right-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}